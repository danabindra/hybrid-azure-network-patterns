<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1080" height="700" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">DIA circuit placement — colo breakout, SD-WAN underlay, hub egress alternative</text>

  <!-- On-prem / colocation panel -->
  <rect x="40" y="60" width="460" height="410" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="60" y="86" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">ON-PREM / COLOCATION</text>

  <!-- Azure panel -->
  <rect x="640" y="60" width="400" height="410" rx="10" fill="#f0f7ff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="660" y="86" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">AZURE REGIONS</text>

  <!-- Interconnect (blue) -->
  <line x1="230" y1="248" x2="305" y2="160" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="230" y1="272" x2="305" y2="370" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="388" y1="190" x2="388" y2="335" stroke="#2563eb" stroke-width="2.5"/>

  <!-- ExpressRoute (green) : Chicago colo to 4 regions -->
  <line x1="475" y1="145" x2="680" y2="140" stroke="#16a34a" stroke-width="2"/>
  <line x1="475" y1="155" x2="680" y2="218" stroke="#16a34a" stroke-width="2"/>
  <line x1="475" y1="165" x2="680" y2="296" stroke="#16a34a" stroke-width="2"/>
  <line x1="475" y1="175" x2="680" y2="374" stroke="#16a34a" stroke-width="2"/>
  <!-- ExpressRoute (green) : Dallas colo to 4 regions -->
  <line x1="475" y1="355" x2="680" y2="146" stroke="#16a34a" stroke-width="2"/>
  <line x1="475" y1="365" x2="680" y2="224" stroke="#16a34a" stroke-width="2"/>
  <line x1="475" y1="375" x2="680" y2="302" stroke="#16a34a" stroke-width="2"/>
  <line x1="475" y1="385" x2="680" y2="380" stroke="#16a34a" stroke-width="2"/>

  <!-- DIA circuits (orange) to Internet -->
  <path d="M 400 190 C 430 300, 470 470, 505 545" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <path d="M 400 400 C 430 460, 470 510, 502 560" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <!-- Legacy DC egress (dashed gray, retiring) -->
  <path d="M 150 290 C 180 420, 330 530, 448 570" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/>
  <!-- Azure hub egress (purple) -->
  <path d="M 840 470 C 800 530, 700 560, 632 572" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <!-- Legacy DC -->
  <rect x="70" y="230" width="160" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Legacy DC</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" fill="#64748b">on-prem, egress retiring</text>

  <!-- Chicago colo -->
  <rect x="305" y="125" width="170" height="65" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Chicago colocation</text>
  <text x="390" y="170" text-anchor="middle" font-size="11" fill="#64748b">ER + DIA breakout</text>

  <!-- Dallas colo -->
  <rect x="305" y="335" width="170" height="65" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Dallas colocation</text>
  <text x="390" y="380" text-anchor="middle" font-size="11" fill="#64748b">ER + DIA breakout</text>

  <!-- Azure region boxes -->
  <rect x="680" y="112" width="320" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="840" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Azure US East</text>
  <text x="840" y="153" text-anchor="middle" font-size="11" fill="#64748b">Non-Prod</text>

  <rect x="680" y="190" width="320" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="840" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Azure US East</text>
  <text x="840" y="231" text-anchor="middle" font-size="11" fill="#64748b">Prod</text>

  <rect x="680" y="268" width="320" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="840" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Azure US Central</text>
  <text x="840" y="309" text-anchor="middle" font-size="11" fill="#64748b">Non-Prod</text>

  <rect x="680" y="346" width="320" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="840" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Azure US Central</text>
  <text x="840" y="387" text-anchor="middle" font-size="11" fill="#64748b">Prod, hub NVA + NAT GW</text>

  <!-- Service edge panel -->
  <rect x="40" y="490" width="300" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="60" y="514" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">SERVICE EDGE</text>
  <rect x="60" y="526" width="260" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="190" y="550" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Branches / service centers</text>
  <text x="190" y="570" text-anchor="middle" font-size="11" fill="#64748b">today: route via legacy DC</text>
  <text x="190" y="588" text-anchor="middle" font-size="11" fill="#64748b">target: colo DIA + hub egress</text>

  <!-- Internet -->
  <rect x="440" y="540" width="200" height="70" rx="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="540" y="570" text-anchor="middle" font-size="16" font-weight="600" fill="#9a3412">Internet</text>
  <text x="540" y="590" text-anchor="middle" font-size="11" fill="#9a3412">DIA: SLA-backed, static IP block</text>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <line x1="60" y1="655" x2="95" y2="655" stroke="#2563eb" stroke-width="2.5"/>
    <text x="102" y="659">On-prem interconnect</text>
    <line x1="250" y1="655" x2="285" y2="655" stroke="#16a34a" stroke-width="2.5"/>
    <text x="292" y="659">ExpressRoute</text>
    <line x1="400" y1="655" x2="435" y2="655" stroke="#ea580c" stroke-width="3"/>
    <text x="442" y="659">DIA circuit</text>
    <line x1="530" y1="655" x2="565" y2="655" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="572" y="659">Legacy DC egress (retiring)</text>
    <line x1="750" y1="655" x2="785" y2="655" stroke="#7c3aed" stroke-width="3"/>
    <text x="792" y="659">Azure hub NVA egress</text>
  </g>
</svg>
